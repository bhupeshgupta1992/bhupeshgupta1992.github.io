name: Generate IJMCH Article Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-articles:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate article pages
        run: |
          python generate_articles.py

      - name: Commit generated article pages
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add article*.html

          git diff --cached --quiet || \
            git commit -m "Automatically update article pages"

          git push
